<!DOCTYPE html>
<html>
<head>

<title>Thought Processer</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
    color: #222;
}

nav {
    background: #2563eb;
    padding: 15px;
    color: white;
    text-align: center;
}

nav h2 {
    margin: 0;
}

.hero {
    text-align: center;
    padding: 50px 20px;
}

.hero h1 {
    font-size: 50px;
    color: #2563eb;
}

.hero p {
    font-size: 22px;
}

textarea {
    width: 300px;
    height: 100px;
    padding: 15px;
    border-radius: 15px;
    border: 2px solid #2563eb;
    font-size: 16px;
}

button {
    background: #2563eb;
    color: white;
    padding: 15px 35px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #1d4ed8;
}


.deleteButton {
    background: #ef4444;
    padding: 8px 20px;
    font-size: 14px;
}

.deleteButton:hover {
    background: #dc2626;
}


.thoughts {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 30px;
}


.thought {
    background: white;
    width: 250px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px #ccc;
    text-align: center;
}


footer {
    background: #2563eb;
    color: white;
    text-align: center;
    padding: 15px;
}

</style>

</head>


<body>


<nav>
<h2>🧠 Thought Processer</h2>
</nav>



<section class="hero">


<h1>Think. Create. Build.</h1>


<p>
Write your thoughts and turn them into ideas.
</p>


<textarea id="thoughtInput" placeholder="Write your thought here..."></textarea>

<br>

<button onclick="addThought()">Add Thought</button>


</section>



<section class="thoughts" id="thoughtsArea">

</section>



<footer>

<p>Created by Founder: Dhanvitha | 10 July 2026</p>

</footer>



<script>


function addThought(){

let text = document.getElementById("thoughtInput").value;


if(text==""){
alert("Please write something first!");
return;
}


let box = document.createElement("div");


box.className="thought";


box.innerHTML = 
"💭 " + text +
"<br><br>" +
"<button class='deleteButton' onclick='deleteThought(this)'>Delete</button>";


document.getElementById("thoughtsArea").appendChild(box);


document.getElementById("thoughtInput").value="";

}



function deleteThought(button){

button.parentElement.remove();

}


</script>



</body>
</html>
