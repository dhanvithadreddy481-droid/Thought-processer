<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thought Processer</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
    color: #222;
}


nav {
    background: #2563eb;
    color: white;
    padding: 18px;
    text-align: center;
}


nav h2 {
    margin: 0;
}


.hero {
    text-align: center;
    padding: 50px 20px;
}


.hero h1 {
    font-size: 50px;
    color: #2563eb;
}


.hero p {
    font-size: 22px;
}


textarea {

    width: 320px;
    height: 120px;
    padding: 15px;

    border-radius: 15px;
    border: 2px solid #2563eb;

    font-size: 16px;

}


button {

    background: #2563eb;
    color: white;

    padding: 15px 35px;

    border: none;
    border-radius: 25px;

    font-size: 18px;

    cursor: pointer;

    margin-top: 15px;

}


button:hover {

    background: #1d4ed8;

}



.thoughts {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 20px;

    padding: 30px;

}



.thought {

    background: white;

    width: 260px;

    padding: 20px;

    border-radius: 15px;

    box-shadow: 0 5px 15px #ccc;

    text-align: center;

}



.deleteButton {

    background: #ef4444;

    padding: 10px 20px;

    font-size: 14px;

}


.deleteButton:hover {

    background: #dc2626;

}



footer {

    background: #2563eb;

    color: white;

    text-align: center;

    padding: 15px;

}


</style>


</head>


<body>



<nav>

<h2>🧠 Thought Processer</h2>

</nav>



<section class="hero">


<h1>Think. Create. Build.</h1>


<p>
Write your thoughts and turn them into ideas.
</p>



<textarea id="thoughtInput" placeholder="Write your thought here..."></textarea>


<br>


<button onclick="addThought()">

Add Thought

</button>


</section>




<section class="thoughts" id="thoughtsArea">


</section>





<footer>

<p>
Created by Founder: Dhanvitha | July 2026
</p>

</footer>





<script>


let thoughts = JSON.parse(localStorage.getItem("thoughts")) || [];

showThoughts();



function addThought(){


let text = document.getElementById("thoughtInput").value;


if(text.trim() === ""){

alert("Please write something first!");

return;

}



thoughts.push(text);



localStorage.setItem(
"thoughts",
JSON.stringify(thoughts)
);



document.getElementById("thoughtInput").value = "";


showThoughts();


}




function showThoughts(){


let area = document.getElementById("thoughtsArea");


area.innerHTML = "";



for(let i = 0; i < thoughts.length; i++){



let box = document.createElement("div");


box.className = "thought";



box.innerHTML = `

<h3>💭 Thought</h3>

<p>${thoughts[i]}</p>


<button class="deleteButton" onclick="deleteThought(${i})">

Delete

</button>

`;



area.appendChild(box);


}



}




function deleteThought(index){


thoughts.splice(index,1);



localStorage.setItem(
"thoughts",
JSON.stringify(thoughts)
);



showThoughts();



}



</script>



</body>

</html>
