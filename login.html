<!DOCTYPE html>
<html>
<head>

<title>Thought Processer Login</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: white;
    padding: 30px;
    width: 300px;
    border-radius: 15px;
    box-shadow: 0 0 15px gray;
    text-align: center;
}

h1 {
    color: #2563eb;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid gray;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#message {
    margin-top: 15px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🧠 Thought Processer</h1>

<h3>Login</h3>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message"></p>

</div>


<script>

function login(){

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;

if(username == "admin" && password == "1234"){
window.location.href = "Index.html";

}
else{

document.getElementById("message").innerHTML =
"❌ Wrong username or password";

}

}

</script>

</body>
</html>
