<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thought Processer</title>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
    color:#222;
}


nav {
    background:#2563eb;
    color:white;
    padding:18px;
    text-align:center;
}


.hero {
    text-align:center;
    padding:40px 20px;
}


.hero h1 {
    font-size:45px;
    color:#2563eb;
}


.hero p {
    font-size:20px;
}



textarea {

    width:320px;
    height:120px;
    padding:15px;
    border-radius:15px;
    border:2px solid #2563eb;
    font-size:16px;

}



button {

    background:#2563eb;
    color:white;
    padding:12px 30px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
    font-size:16px;

}


button:hover {

    background:#1d4ed8;

}



#count {

    font-size:18px;
    color:#2563eb;

}



.thoughts {

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:30px;

}



.thought {

    background:white;
    width:270px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px #ccc;

}



.date {

    font-size:12px;
    color:gray;

}



.deleteButton {

    background:#ef4444;

}



.editButton {

    background:#16a34a;

}



footer {

    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;

}


</style>


</head>


<body>


<nav>
<h2>🧠 Thought Processer</h2>
</nav>



<section class="hero">

<h1>Think. Create. Build.</h1>

<p>
Turn your thoughts into ideas.
</p>


<textarea id="thoughtInput" placeholder="Write your thought here..."></textarea>

<br>


<button onclick="addThought()">Add Thought</button>


<h3 id="count"></h3>


</section>



<section class="thoughts" id="thoughtsArea">

</section>



<footer>

<p>
Created by Founder: Dhanvitha | Version 5 | July 2026
</p>

</footer>



<script>


let thoughts = JSON.parse(localStorage.getItem("thoughts")) || [];


showThoughts();



function addThought(){


let input=document.getElementById("thoughtInput");


if(input.value.trim()==""){

alert("Please write something!");

return;

}



thoughts.push({

text:input.value,

date:new Date().toLocaleString()

});



localStorage.setItem(
"thoughts",
JSON.stringify(thoughts)
);



input.value="";


showThoughts();


}




function showThoughts(){


let area=document.getElementById("thoughtsArea");


area.innerHTML="";


document.getElementById("count").innerHTML =
"Total Thoughts: " + thoughts.length;



thoughts.forEach(function(item,index){


let box=document.createElement("div");


box.className="thought";


box.innerHTML=`

<h3>💭 Thought</h3>

<p>${item.text}</p>

<p class="date">
Created: ${item.date}
</p>


<button class="editButton" onclick="editThought(${index})">
Edit
</button>


<button class="deleteButton" onclick="deleteThought(${index})">
Delete
</button>

`;



area.appendChild(box);


});


}




function deleteThought(index){


thoughts.splice(index,1);


localStorage.setItem(
"thoughts",
JSON.stringify(thoughts)
);


showThoughts();


}





function editThought(index){


let newText=prompt(
"Edit your thought:",
thoughts[index].text
);



if(newText!=null && newText.trim()!=""){


thoughts[index].text=newText;


localStorage.setItem(
"thoughts",
JSON.stringify(thoughts)
);



showThoughts();


}


}


</script>


</body>

</html>
